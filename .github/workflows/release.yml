name: release

# A release starts by hand, as a pull request that sets the version. Merging it publishes the version
# to npm as `latest`, once scripts/release-gate.mjs finds it approved by someone other than its
# author (ADR-044). Any other merge to main publishes nothing (ADR-045).
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Open a pull request for the next release. Leave unticked to only publish a merged release that is missing from npm.'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - run: pnpm test

      # A stable version that npm does not have yet is a release waiting to be published: either the
      # merge of a release pull request, or a run whose publish failed after the tag was pushed.
      - name: Find what this run releases
        id: state
        run: |
          version=$(node -p "require('./packages/simply-confluence-explorer/package.json').version")
          tag="@simplysf/simply-confluence-explorer@$version"
          release=false
          if [[ "$version" != *-* ]] && [ -z "$(npm view "@simplysf/simply-confluence-explorer@$version" version 2>/dev/null)" ]; then
            release=true
          fi
          tagged=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tagged=true
          { echo "version=$version"; echo "tag=$tag"; echo "release=$release"; echo "tagged=$tagged"; } >> "$GITHUB_OUTPUT"

      # The commit checked is the one the version was merged in: the tag's commit when an earlier run
      # pushed the tag, otherwise the commit this run is on.
      - name: Check the release was approved
        if: steps.state.outputs.release == 'true'
        run: |
          commit=$GITHUB_SHA
          if [ "$TAGGED" = true ]; then commit=$(git rev-list -n 1 "$TAG"); fi
          node scripts/release-gate.mjs check "$VERSION" "$commit"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
          TAG: ${{ steps.state.outputs.tag }}
          TAGGED: ${{ steps.state.outputs.tagged }}

      - name: Tag
        if: steps.state.outputs.release == 'true' && steps.state.outputs.tagged == 'false'
        run: |
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          awk -v v="$VERSION" 'index($0, "# [" v "]") == 1 { on = 1; next } on && /^# \[/ { exit } on' \
            packages/simply-confluence-explorer/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          VERSION: ${{ steps.state.outputs.version }}
          TAG: ${{ steps.state.outputs.tag }}

      # Lerna works out the next version from the commits since the last release, and writes it and
      # its changelog without committing or tagging; the commit goes on its own branch, and nothing is published until its pull request is approved
      # and merged.
      - name: Open the release pull request
        if: github.event_name == 'workflow_dispatch' && inputs.stable && github.ref_name == 'main'
        run: |
          pnpm exec lerna version --conventional-commits --no-git-tag-version --no-push --yes
          version=$(node -p "require('./packages/simply-confluence-explorer/package.json').version")
          git switch -c "release/$version"
          git commit -am "chore(release): $version"
          git push origin "release/$version"
          node scripts/release-gate.mjs body "$version" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "release/$version" --title "chore(release): $version" --body-file "$RUNNER_TEMP/body.md"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # Runs only after the approval check has passed. A run whose tag was pushed but whose publish
      # failed is finished by the next merge, or by running the workflow by hand with stable unticked.
      - name: Publish
        if: steps.state.outputs.release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.stable)
        run: pnpm exec lerna publish from-package --yes
        env:
          NPM_CONFIG_PROVENANCE: true
